name: 🚀 Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: 🏗️ Build Packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧰 Install Tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: 🏗️ Build and Package
        run: mise run package
      - name: ⬆️ Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.rpm
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  assets:
    name: 📦 Attach Release Assets
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist
      # Without name, body or prerelease inputs, the release keeps the text release-please wrote.
      - name: ⬆️ Upload Packages
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.rpm
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
