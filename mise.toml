[tools]
go = "1.27.2"
nfpm = "2.48.0"

[env]
VERSION = "0.2.0" # x-release-please-version
# A static binary runs on any distribution the packages target. Without cgo, user and group
# lookups read /etc/passwd and /etc/group only, not SSSD or LDAP.
CGO_ENABLED = "0"

[tasks.build]
description = "Build bin/gpn"
run = 'go build -trimpath -ldflags "-X main.version=$VERSION-$(git rev-parse --short HEAD)" -o bin/gpn ./cmd/gpn'

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.check]
description = "Format check, vet and test"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "go test ./...",
]

[tasks.package]
description = "Build the packages into dist/"
depends = ["build"]
run = [
  "mkdir -p dist",
  "nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/",
  "nfpm package --config packaging/nfpm.yaml --packager deb --target dist/",
  "nfpm package --config packaging/nfpm.yaml --packager archlinux --target dist/",
  "cd dist && sha256sum *.rpm *.deb *.pkg.tar.zst > SHA256SUMS",
]
