[tools]
go = "1.27.3"
nfpm = "2.48.0"
# gomobile compiles the Android core's Java bindings with javac.
java = "temurin-21.0.13+9.0.LTS"

[env]
VERSION = "0.3.0" # x-release-please-version
# A static binary runs on any distribution the packages target. Without cgo, user and group
# lookups read /etc/passwd and /etc/group only, not SSSD or LDAP.
CGO_ENABLED = "0"
# Android Studio's SDK Manager installs the SDK and the NDK here, unless ANDROID_HOME says
# otherwise, as on CI runners.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"

[tasks.build]
description = "Build bin/gpn"
run = 'go build -trimpath -ldflags "-X main.version=$VERSION-$(git rev-parse --short HEAD)" -o bin/gpn ./cmd/gpn'

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.check]
description = "Format check, vet and test"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "go test ./...",
]

[tasks.package]
description = "Build the packages into dist/"
depends = ["build"]
run = [
  "mkdir -p dist",
  "nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/",
  "nfpm package --config packaging/nfpm.yaml --packager deb --target dist/",
  "nfpm package --config packaging/nfpm.yaml --packager archlinux --target dist/",
  "cd dist && sha256sum *.rpm *.deb *.pkg.tar.zst > SHA256SUMS",
]

[tasks."android:core"]
description = "Build the Go core of the Android app into android/app/libs/core.aar"
env = { CGO_ENABLED = "1" }
run = [
  "mkdir -p bin android/app/libs",
  "go build -o bin/ golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind",
  "PATH=\"$PWD/bin:$PATH\" gomobile bind -target=android/arm64,android/amd64 -androidapi 29 -javapkg dev.dvjn.gpn -trimpath -o android/app/libs/core.aar ./mobile",
]

[tasks."android:app"]
description = "Build the Android app's debug APK, with the Go core"
depends = ["android:core"]
dir = "android"
run = "./gradlew --console=plain assembleDebug"

[tasks."android:release"]
description = "Build the Android app's release APK into dist/, signed with GPN_KEYSTORE when it is set"
depends = ["android:core"]
run = [
  "cd android && ./gradlew --console=plain assembleRelease",
  "mkdir -p dist",
  "cp android/app/build/outputs/apk/release/app-release*.apk dist/globalprotect-native-$VERSION.apk",
]

[tasks."android:install"]
description = "Install the debug APK on the connected device and open it"
depends = ["android:core"]
dir = "android"
run = [
  "./gradlew --console=plain installDebug",
  "$ANDROID_HOME/platform-tools/adb shell am start -n dev.dvjn.gpn/.MainActivity",
]
